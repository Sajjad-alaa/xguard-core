name: Continuous integration

on:
  push:
    branches:
      - dev
      - "release/**"
      - "stable/**"
    paths-ignore:
      - "*.md"
      - "LICENSE"
  pull_request:
    branches:
      - dev
      - "release/**"
      - "stable/**"
    paths-ignore:
      - "*.md"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  lint:
    runs-on:
      - codebuild-xguard-core-runner-${{ github.run_id }}-${{ github.run_attempt }}
      - instance-size:large

    container: public.ecr.aws/docker/library/rust:1

    env:
      CARGO_TERM_COLOR: always
      SQLX_OFFLINE: true
      RUSTC_WRAPPER: sccache
      SCCACHE_BUCKET: xguard-gh-build-cache
      SCCACHE_REGION: eu-central-1
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_CACHE_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_CACHE_SECRET_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive

      - name: Export workspace-relative cache paths
        run: |
          echo "CARGO_HOME=$GITHUB_WORKSPACE/.cargo"    >> $GITHUB_ENV
          echo "$GITHUB_WORKSPACE/.cargo/bin"           >> $GITHUB_PATH

      - name: Cache cargo registry
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry/index
            ${{ env.CARGO_HOME }}/registry/cache
            ${{ env.CARGO_HOME }}/git/db
          key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Scan code with Trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        env:
          TRIVY_SHOW_SUPPRESSED: 1
          TRIVY_IGNOREFILE: "./.trivyignore.yaml"
        with:
          scan-type: "fs"
          scan-ref: "."
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH,MEDIUM"
          scanners: "vuln"

      - name: Install protoc
        run: apt-get update && apt-get -y install libudev-dev protobuf-compiler

      - name: Check format
        run: |
          rustup component add rustfmt
          cargo fmt -- --check

      - name: Run clippy linter
        run: |
          rustup component add clippy
          cargo clippy --all-targets --all-features -- -D warnings

      # The `openapi` feature is on by default, so `--all-features` above never
      # exercises the build without it. See CONTRIBUTING.md.
      - name: Run clippy linter without default features
        run: cargo clippy --all-targets --no-default-features -- -D warnings

      - name: Install cargo-deny
        uses: taiki-e/install-action@9e1e5806d4a4822de933115878265be9aaa786d9 # v2.82.2
        with:
          tool: cargo-deny

      - name: Run cargo deny
        run: cargo deny check --hide-inclusion-graph

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

  build:
    runs-on:
      - codebuild-xguard-core-runner-${{ github.run_id }}-${{ github.run_attempt }}
      - instance-size:2xlarge

    container: public.ecr.aws/docker/library/rust:1

    env:
      CARGO_TERM_COLOR: always
      SQLX_OFFLINE: true
      RUSTC_WRAPPER: sccache
      SCCACHE_BUCKET: xguard-gh-build-cache
      SCCACHE_REGION: eu-central-1
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_CACHE_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_CACHE_SECRET_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive

      - name: Export workspace-relative cache paths
        run: |
          echo "CARGO_HOME=$GITHUB_WORKSPACE/.cargo"    >> $GITHUB_ENV
          echo "$GITHUB_WORKSPACE/.cargo/bin"           >> $GITHUB_PATH

      - name: Cache cargo registry
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry/index
            ${{ env.CARGO_HOME }}/registry/cache
            ${{ env.CARGO_HOME }}/git/db
          key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Install protoc
        run: apt-get update && apt-get -y install libudev-dev protobuf-compiler

      - name: Install cargo-nextest
        uses: taiki-e/install-action@9e1e5806d4a4822de933115878265be9aaa786d9 # v2.82.2
        with:
          tool: cargo-nextest

      - name: Build and archive tests
        run: |
          cargo nextest archive \
            --locked \
            --all-features \
            --archive-file nextest-archive.tar.zst \
            --config 'profile.test.debug=false' \
            --config 'profile.test.strip="debuginfo"'

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

      - name: Upload test archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nextest-archive
          path: nextest-archive.tar.zst
          retention-days: 1

  test:
    needs: build

    runs-on:
      - codebuild-xguard-core-runner-${{ github.run_id }}-${{ github.run_attempt }}
      - instance-size:large

    container: public.ecr.aws/docker/library/rust:1

    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4, 5, 6, 7, 8]

    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17-alpine
        env:
          POSTGRES_DB: xguard
          POSTGRES_USER: xguard
          POSTGRES_PASSWORD: xguard
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        command: postgres -c max_connections=400

    env:
      CARGO_TERM_COLOR: always
      XGUARD_DB_HOST: postgres
      XGUARD_DB_PORT: 5432
      XGUARD_DB_NAME: xguard
      XGUARD_DB_USER: xguard
      XGUARD_DB_PASSWORD: xguard
      DATABASE_URL: "postgresql://xguard:xguard@postgres/xguard"
      SQLX_OFFLINE: true

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Download test archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nextest-archive

      - name: Install cargo-nextest
        uses: taiki-e/install-action@9e1e5806d4a4822de933115878265be9aaa786d9 # v2.82.2
        with:
          tool: cargo-nextest

      - name: Run tests (shard ${{ matrix.partition }}/8)
        run: |
          cargo nextest run \
            --no-fail-fast \
            --archive-file nextest-archive.tar.zst \
            --partition hash:${{ matrix.partition }}/8


  cleanup:
    needs: [test]
    if: needs.test.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete test archive artifact
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        with:
          script: |
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            const artifact = artifacts.data.artifacts.find(a => a.name === 'nextest-archive');
            if (artifact) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
            }
