services:
  core:
    image: ghcr.io/sajjad-alaa/xguard-core:${IMAGE_TAG}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      XGUARD_DB_HOST: db
      XGUARD_DB_PORT: 5432
      XGUARD_DB_USER: xguard
      XGUARD_DB_PASSWORD: xguard
      XGUARD_DB_NAME: xguard
      RUST_BACKTRACE: 1
    ports:
      # REST API
      - "8000:8000"
      # Default Core GRPC port
      - "50055:50055"
    depends_on:
      - db

  gateway:
    image: ghcr.io/sajjad-alaa/xguard-gateway:${IMAGE_TAG}
    ports:
      # WireGuard endpoint
      - "50051:50051/udp"
      # Default Gateway GRPC port
      - "50066:50066"
    depends_on:
      - core
    cap_add:
      - NET_ADMIN

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: xguard
      POSTGRES_USER: xguard
      POSTGRES_PASSWORD: xguard
    volumes:
      - ./.volumes/db:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # vector:
