services:
  core:
    image: ghcr.io/sajjad-alaa/xguard-core:${CORE_IMAGE_TAG:-${IMAGE_TAG}}
    environment:
      XGUARD_COOKIE_INSECURE: true
      XGUARD_COOKIE_DOMAIN: localhost
      XGUARD_LOG_LEVEL: debug
      XGUARD_DB_HOST: db
      XGUARD_DB_PORT: 5432
      XGUARD_DB_USER: xguard
      XGUARD_DB_PASSWORD: xguard
      XGUARD_DB_NAME: xguard
      XGUARD_GRPC_PORT: 50055
      RUST_BACKTRACE: 1
    ports:
      # REST API
      - "8000:8000"
      # Default Core GRPC port
      - "50055:50055"
    depends_on:
      - db

  db:
    image: public.ecr.aws/docker/library/postgres:17-alpine
    environment:
      POSTGRES_DB: xguard
      POSTGRES_USER: xguard
      POSTGRES_PASSWORD: xguard
    ports:
      - "${E2E_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xguard -d xguard"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  edge:
    image: ghcr.io/sajjad-alaa/xguard-proxy:${EDGE_IMAGE_TAG:-${IMAGE_TAG}}
    ports:
      # REST API
      - "8080:8080"
      # Default Edge GRPC port
      - "50051:50051"
    environment:
      XGUARD_PROXY_GRPC_PORT: 50051
      RUST_BACKTRACE: 1

  gateway:
    image: ghcr.io/sajjad-alaa/xguard-gateway:${GATEWAY_IMAGE_TAG:-${IMAGE_TAG}}
    ports:
      - "50066:50066"
    environment:
      XGUARD_GATEWAY_GRPC_PORT: 50066
      RUST_BACKTRACE: 1
    cap_add:
      - NET_ADMIN

  mailpit:
    image: axllent/mailpit:latest
