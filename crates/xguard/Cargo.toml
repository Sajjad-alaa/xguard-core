[package]
name = "xguard"
version = "0.0.0"
edition.workspace = true
license-file.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# internal crates
xguard_common.workspace = true
xguard_core.workspace = true
xguard_event_logger.workspace = true
xguard_gateway_manager.workspace = true
xguard_proxy_manager.workspace = true
xguard_session_manager.workspace = true
xguard_version.workspace = true
xguard_vpn_stats_purge.workspace = true
xguard_setup.workspace = true

# external dependencies
anyhow.workspace = true
bytes.workspace = true
dotenvy = "0.15"
rustls.workspace = true
secrecy.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true

[features]
default = ["openapi"]

# Serve the OpenAPI specification and the Swagger UI. See the `openapi` feature of
# `xguard_core`. Build with `--no-default-features` to leave it out.
openapi = ["xguard_core/openapi", "xguard_common/openapi"]
